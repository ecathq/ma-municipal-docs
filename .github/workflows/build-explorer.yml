name: Build & publish explorer

# Token-free build & publish (reverse-flow).
# When votes.json (or the template/build script) changes, rebuild the explorer,
# gate it on QA, and commit the built page — explorer/index.html — back to THIS
# public repo using the built-in GITHUB_TOKEN. There is NO cross-repo secret.
# The app (ma-municipal-chat) pulls that public file itself (see DEPLOY.md), so
# no credential ever lives in this public repo.

on:
  push:
    branches: [main]
    paths:
      - "amherst/votes.json"
      - "explorer/explorer.template.html"
      - "explorer/build_explorer.py"
      - ".github/workflows/build-explorer.yml"
  workflow_dispatch: {}

permissions:
  contents: write        # only this repo; GITHUB_TOKEN can't reach any other repo

concurrency:
  group: build-explorer
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Rebuild explorer from latest votes.json
        run: python3 explorer/build_explorer.py

      # Gate: don't publish a page that doesn't reconcile or doesn't match the data.
      - name: QA gate (data invariants + page logic)
        run: |
          python3 validate_votes.py
          node eval/test_page.js

      - name: Commit the built page (only if it changed)
        run: |
          if git diff --quiet -- explorer/index.html; then
            echo "No change to explorer/index.html — nothing to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add explorer/index.html
          git commit -m "Rebuild explorer from latest votes.json [skip ci]"
          git push
# The commit above uses the default GITHUB_TOKEN, whose pushes do NOT trigger
# further workflow runs (GitHub loop-prevention) — and explorer/index.html isn't
# in the trigger paths anyway. So this can't loop.
