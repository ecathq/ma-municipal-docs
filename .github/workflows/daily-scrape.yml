# Daily Amherst Town Council scraper.
# Runs at 7am US Eastern (11:00 UTC). Adjust if you want a different time.

name: Daily scrape

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 7am EDT / 6am EST
  workflow_dispatch:        # allow manual trigger from Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # needed to commit and push

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python3 scrape_amherst_minutes.py

      - name: Commit and push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add amherst/
          if git diff --staged --quiet; then
            echo "No new documents — nothing to commit."
          else
            git commit -m "Daily scrape: $(date -u +%Y-%m-%d)"
            git push
          fi
