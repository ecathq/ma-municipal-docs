name: Data & page QA

# Runs the deterministic checks and produces a viewable HTML report:
#   - Build             (explorer/build_explorer.py): regenerate the page
#   - Data invariants   (validate_votes.py): every vote reconciles with the tally
#   - Page logic        (eval/test_page.js): page matches an independent recount
#   - Ground truth      (eval/check_gold.py): human-verified sample accuracy
# The report is uploaded as a downloadable build artifact on every run.
# (No GitHub Pages here — the live explorer is served from the private app repo.)

on:
  push:
    branches: [main]
    paths:
      - "amherst/votes.json"
      - "explorer/**"
      - "validate_votes.py"
      - "build_votes_dataset.py"
      - "eval/**"
      - ".github/workflows/qa.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "30 12 * * *"   # daily, shortly after the morning scrape

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      # run_qa.py builds the page, runs all checks, and writes eval/qa-report.html.
      - name: Run QA (build + invariants + page logic + gold, and the report)
        id: qa
        continue-on-error: true
        run: python3 eval/run_qa.py

      - name: Upload QA report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: eval/qa-report.html

      - name: Enforce gate
        if: steps.qa.outcome == 'failure'
        run: exit 1
