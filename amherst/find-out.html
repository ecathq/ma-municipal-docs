<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amherst Town Council — Find Out</title>
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--ink:#1c2230;--muted:#5b6472;--faint:#8a92a0;--line:#e4e7ec;
  --accent:#2563eb;--accent-d:#1d4ed8;--accent-soft:#e8eefc;
  --yes:#15803d;--no:#b91c1c;--abstain:#b45309;--absent:#6b7280;
  --yes-bg:#e7f5ec;--no-bg:#fdeaea;--abstain-bg:#fdf1e1;--absent-bg:#eef0f2;
  --shadow:0 1px 3px rgba(16,24,40,.05),0 8px 28px rgba(16,24,40,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif}
.shell{max-width:760px;margin:0 auto;padding:30px 20px 70px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.brand h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.tagline{color:var(--muted);font-size:15px;margin:0 0 22px}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:30px 30px 26px}
.steps{display:flex;gap:8px;align-items:center;margin-bottom:20px}
.steps .s{height:7px;border-radius:99px;background:var(--line);flex:1;transition:.2s}
.steps .s.on{background:var(--accent)}
.stepno{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.q{font-size:27px;font-weight:700;letter-spacing:-.02em;margin:0 0 22px;line-height:1.25}

.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:15px;width:100%;text-align:left;cursor:pointer;
  background:#fff;border:2px solid var(--line);border-radius:14px;padding:17px 19px;font:inherit;color:var(--ink);transition:.12s}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .oi{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0}
.opt.sel .oi{background:var(--accent);color:#fff}
.opt .ot{font-size:19px;font-weight:600}
.opt .od{font-size:14px;color:var(--muted);margin-top:1px}
.opt .check{margin-left:auto;color:var(--accent);font-size:24px;opacity:0}
.opt.sel .check{opacity:1}
.rec{margin-left:auto;background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px;white-space:nowrap}
.opt.sel .rec{display:none}

.subpick{margin:16px 0 2px;padding:16px 18px;background:var(--bg);border-radius:13px}
.subpick label{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-bottom:8px}
select{font:inherit;font-size:18px;background:#fff;color:var(--ink);border:2px solid var(--line);
  border-radius:11px;padding:12px 14px;width:100%;cursor:pointer}
select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

.nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
button.nav-btn{font:inherit;font-size:17px;font-weight:600;border-radius:12px;padding:13px 24px;cursor:pointer;border:2px solid transparent}
.back{background:transparent;border-color:var(--line);color:var(--muted)}
.back:hover{border-color:var(--muted);color:var(--ink)}
.next{background:var(--accent);color:#fff;border-color:var(--accent)}
.next:hover{background:var(--accent-d);border-color:var(--accent-d)}
.next:disabled{background:var(--line);border-color:var(--line);color:var(--faint);cursor:not-allowed}
.ghost{visibility:hidden}

/* result */
.answer-lede{font-size:22px;line-height:1.45;margin:0 0 22px;font-weight:500}
.answer-lede b{color:var(--accent-d)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.metric{border-radius:14px;padding:16px 14px}
.metric .n{font-size:30px;font-weight:700;line-height:1}
.metric .l{font-size:13px;font-weight:600;margin-top:6px}
.metric.yes{background:var(--yes-bg)}.metric.yes .n,.metric.yes .l{color:var(--yes)}
.metric.no{background:var(--no-bg)}.metric.no .n,.metric.no .l{color:var(--no)}
.metric.abstain{background:var(--abstain-bg)}.metric.abstain .n,.metric.abstain .l{color:var(--abstain)}
.metric.absent{background:var(--absent-bg)}.metric.absent .n,.metric.absent .l{color:var(--absent)}
svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:18px;font-size:14px;color:var(--muted);flex-wrap:wrap;margin-top:14px}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:-2px}
.tweaks{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;background:var(--bg);border-radius:14px;padding:16px 18px;margin:22px 0}
.tweak{display:flex;flex-direction:column;gap:6px}
.tweak label{font-size:13px;color:var(--muted);font-weight:600}
.tweak select{font-size:16px;padding:9px 12px;min-width:170px}
.viz-switch{display:flex;gap:7px;flex-wrap:wrap}
.viz-switch button{font:inherit;font-size:14px;font-weight:600;border:2px solid var(--line);background:#fff;color:var(--muted);
  border-radius:10px;padding:9px 13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.viz-switch button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-d)}
.reveal{margin:8px 0 0}
.reveal summary{cursor:pointer;font-size:15px;font-weight:600;color:var(--accent-d);list-style:none;padding:8px 0}
.reveal summary::-webkit-details-marker{display:none}
.reveal summary::before{content:"\\203A";margin-right:8px;display:inline-block;transition:.15s}
.reveal[open] summary::before{transform:rotate(90deg)}
.tablewrap{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#fafbfc;color:var(--muted);font-size:12px;font-weight:600;position:sticky;top:0}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;text-transform:capitalize}
.pill.yes{background:var(--yes-bg);color:var(--yes)}.pill.no{background:var(--no-bg);color:var(--no)}
.pill.abstain{background:var(--abstain-bg);color:var(--abstain)}.pill.absent{background:var(--absent-bg);color:var(--absent)}
.pill.con{background:var(--abstain-bg);color:var(--abstain)}.pill.un{background:var(--absent-bg);color:var(--absent)}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent-d);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600;margin:1px 3px 1px 0}
.mut{color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
a.pdf{color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap}
a.pdf:hover{text-decoration:underline}
.startover{margin-top:8px;text-align:center}
.startover button{font:inherit;font-size:16px;font-weight:600;background:transparent;border:2px solid var(--line);
  color:var(--muted);border-radius:12px;padding:12px 22px;cursor:pointer}
.startover button:hover{border-color:var(--accent);color:var(--accent-d)}
.foot{color:var(--faint);font-size:13px;margin-top:18px;line-height:1.6;text-align:center}
.empty{color:var(--muted);padding:22px;text-align:center}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style></head><body>

const COL={yes:'var(--yes)',no:'var(--no)',abstain:'var(--abstain)',absent:'var(--absent)'};
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pretty=t=>t.replace(/-/g,' ').replace(/\b\w/g,m=>m.toUpperCase());

const councilors=[...new Set(B.map(b=>b.c))].sort();
const topics=[...new Set(M.flatMap(m=>m.t))].sort();
const motionsByCouncilor={}; B.forEach(b=>{(motionsByCouncilor[b.c] ||= new Set()).add(b.i)});
const voteByCM={}; B.forEach(b=>{voteByCM[b.c+'|'+b.i]=b.v});

// ---- question catalogue (plain language -> engine params) ----
const QUESTIONS={
  who_council:[
    {id:'busy',   t:'How busy the council has been', d:'Number of decisions voted on each year', icon:'ti-calendar-stats', measure:'motions_count', group:'Year', viz:['bar','line','table'], rec:'bar'},
    {id:'split',  t:'How often the council disagreed', d:'Share of votes that were not unanimous', icon:'ti-arrows-split', measure:'contested_rate', group:'Year', viz:['line','bar','table'], rec:'line'},
    {id:'ctopics',t:'What topics come up most', d:'Which subjects the council votes on', icon:'ti-tags', measure:'motions_count', group:'Topic', viz:['bar','table'], rec:'bar'},
  ],
  who_councilor:[
    {id:'voted',  t:'How they voted overall', d:'Yes, No, abstained, or absent', icon:'ti-checkup-list', measure:'vote_breakdown', group:'none', viz:['cards','donut','stacked','table'], rec:'cards'},
    {id:'abstain',t:'How often they abstained', d:'Times they did not take a side, by year', icon:'ti-hand-stop', measure:'abstain_count', group:'Year', viz:['line','bar','table'], rec:'line'},
    {id:'pvotes', t:'What topics they vote on', d:'Which subjects they weigh in on most', icon:'ti-tags', measure:'votes_count', group:'Topic', viz:['bar','table'], rec:'bar'},
    {id:'absent', t:'How often they were absent', d:'Meetings missed, by year', icon:'ti-user-off', measure:'absent_count', group:'Year', viz:['line','bar','table'], rec:'line'},
  ],
};
const VIZ={
  cards:{t:'Quick numbers', icon:'ti-layout-grid'},
  donut:{t:'Pie', icon:'ti-chart-pie'},
  stacked:{t:'Coloured bars', icon:'ti-chart-bar'},
  bar:{t:'Bars', icon:'ti-chart-bar'},
  line:{t:'Over the years', icon:'ti-chart-line'},
  table:{t:'Plain list', icon:'ti-list'},
};

const MEAS={
  vote_breakdown:{grain:'ballot',kind:'breakdown'},
  votes_count:{grain:'ballot',kind:'scalar',calc:r=>r.length},
  abstain_count:{grain:'ballot',kind:'scalar',calc:r=>r.filter(b=>b.v==='abstain').length},
  absent_count:{grain:'ballot',kind:'scalar',calc:r=>r.filter(b=>b.v==='absent').length},
  motions_count:{grain:'motion',kind:'scalar',calc:r=>r.length},
  contested_rate:{grain:'motion',kind:'scalar',pct:true,calc:r=>r.length?100*r.filter(m=>m.con).length/r.length:0},
};

// ---- engine ----
function baseRows(meas,councilor,topic){
  if(meas.grain==='ballot'){let rows=B;
    if(councilor!=='__all') rows=rows.filter(b=>b.c===councilor);
    if(topic) rows=rows.filter(b=>M[b.i].t.includes(topic));return rows;}
  let idx=M.map((m,i)=>i);
  if(councilor!=='__all'){const s=motionsByCouncilor[councilor]||new Set();idx=idx.filter(i=>s.has(i));}
  if(topic) idx=idx.filter(i=>M[i].t.includes(topic));
  return idx.map(i=>M[i]);
}
function keysOf(row,group,grain){const m=grain==='ballot'?M[row.i]:row;
  if(group==='Year')return[m.d.slice(0,4)];
  if(group==='Topic')return m.t.length?m.t:['untagged'];
  return['All'];}
function aggregate(measure,group,councilor,topic){
  const meas=MEAS[measure],rows=baseRows(meas,councilor,topic),groups={};
  rows.forEach(r=>keysOf(r,group,meas.grain).forEach(k=>{(groups[k] ||= []).push(r)}));
  let keys=Object.keys(groups);
  if(group==='Topic')keys=keys.filter(k=>k!=='untagged');
  if(group==='Year')keys.sort();
  else keys.sort((a,b)=>(meas.kind==='breakdown'?groups[b].length-groups[a].length:meas.calc(groups[b])-meas.calc(groups[a])));
  const out=keys.map(k=>{const g=groups[k];
    if(meas.kind==='breakdown'){const seg={yes:0,no:0,abstain:0,absent:0};g.forEach(b=>seg[b.v]++);return{key:k,seg,value:g.length};}
    return{key:k,value:+meas.calc(g).toFixed(meas.pct?1:0)};});
  return{meas,rows,groups:out,group,councilor,topic};
}

// ---- renderers ----
function svg(w,h,inner,a){return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${a||''}">${inner}</svg>`}
function gridY(max,W,pL,pT,pB,H,u){let s='';for(let i=0;i<=4;i++){const gy=pT+(H-pT-pB)*i/4,v=Math.round(max*(1-i/4));
  s+=`<line x1="${pL}" y1="${gy}" x2="${W-8}" y2="${gy}" stroke="#eef0f3"/><text x="${pL-8}" y="${gy+4}" text-anchor="end" font-size="12" fill="#8a92a0">${v}${u||''}</text>`;}return s;}
function rCards(seg){const tot=VOTES.reduce((a,k)=>a+seg[k],0);
  const lab={yes:'Voted yes',no:'Voted no',abstain:'Abstained',absent:'Was absent'};
  return `<div class="cards">`+VOTES.map(k=>`<div class="metric ${k}"><div class="n">${seg[k]}</div><div class="l">${lab[k]}</div></div>`).join('')+`</div>`;}
function rBar(groups,u){const W=700,H=300,pL=46,pT=14,pB=54,n=groups.length||1,max=Math.max(1,...groups.map(g=>g.value)),gap=Math.min(20,420/n),bw=(W-pL-16-gap*(n-1))/n;
  let s=gridY(max,W,pL,pT,pB,H,u);groups.forEach((g,i)=>{const x=pL+i*(bw+gap),h=(H-pT-pB)*(g.value/max),y=H-pB-h;
    s+=`<rect x="${x}" y="${y}" width="${Math.max(1,bw)}" height="${Math.max(1,h)}" rx="5" fill="var(--accent)"><title>${g.key}: ${g.value}${u||''}</title></rect>`;
    if(bw>24)s+=`<text x="${x+bw/2}" y="${y-7}" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2230">${g.value}${u||''}</text>`;
    s+=`<text x="${x+bw/2}" y="${H-pB+18}" text-anchor="middle" font-size="12" fill="#5b6472" transform="rotate(${n>9?-28:0} ${x+bw/2} ${H-pB+18})">${g.key.length>13?g.key.slice(0,12)+'…':g.key}</text>`;});
  return svg(W,H,s,'bar chart');}
function rLine(groups,u){const W=700,H=290,pL=46,pT=14,pB=40,p=groups,max=Math.max(1,...p.map(d=>d.value)),xs=i=>pL+(W-pL-16)*(p.length<2?.5:i/(p.length-1)),ys=v=>H-pB-(H-pT-pB)*(v/max);
  let s=gridY(max,W,pL,pT,pB,H,u);s+=`<path d="${p.map((d,i)=>(i?'L':'M')+xs(i)+','+ys(d.value)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3"/>`;
  p.forEach((d,i)=>{s+=`<circle cx="${xs(i)}" cy="${ys(d.value)}" r="4.5" fill="var(--accent)"><title>${d.key}: ${d.value}${u||''}</title></circle><text x="${xs(i)}" y="${ys(d.value)-11}" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2230">${d.value}${u||''}</text><text x="${xs(i)}" y="${H-pB+18}" text-anchor="middle" font-size="12" fill="#5b6472">${d.key}</text>`;});
  return svg(W,H,s,'line chart');}
function rStacked(groups){const W=700,labW=120,rh=28,gap=10,n=groups.length,max=Math.max(1,...groups.map(g=>VOTES.reduce((a,k)=>a+g.seg[k],0))),H=n*(rh+gap)+6;let s='';
  groups.forEach((g,i)=>{const y=i*(rh+gap)+2;let x=labW;const tot=VOTES.reduce((a,k)=>a+g.seg[k],0);
    s+=`<text x="0" y="${y+rh/2+5}" font-size="13" fill="#5b6472">${g.key.length>15?g.key.slice(0,14)+'…':g.key}</text>`;
    VOTES.forEach(k=>{const w=(W-labW-44)*(g.seg[k]/max);if(w>0){s+=`<rect x="${x}" y="${y}" width="${w}" height="${rh}" fill="${COL[k]}"><title>${g.key} — ${k}: ${g.seg[k]}</title></rect>`;if(w>17)s+=`<text x="${x+w/2}" y="${y+rh/2+5}" text-anchor="middle" font-size="12" fill="#fff">${g.seg[k]}</text>`;x+=w;}});
    s+=`<text x="${x+6}" y="${y+rh/2+5}" font-size="12" fill="#8a92a0">${tot}</text>`;});
  return svg(W,H,s,'coloured bars')+legend();}
function rDonut(seg){const tot=VOTES.reduce((a,k)=>a+seg[k],0)||1,R=92,r=56,cx=125,cy=125;let a0=-Math.PI/2,s='';
  VOTES.forEach(k=>{const f=seg[k]/tot;if(f<=0)return;const a1=a0+f*2*Math.PI,lg=f>.5?1:0,P=(an,rd)=>[cx+rd*Math.cos(an),cy+rd*Math.sin(an)];
    const[x0,y0]=P(a0,R),[x1,y1]=P(a1,R),[xi1,yi1]=P(a1,r),[xi0,yi0]=P(a0,r);
    s+=`<path d="M${x0},${y0} A${R},${R} 0 ${lg} 1 ${x1},${y1} L${xi1},${yi1} A${r},${r} 0 ${lg} 0 ${xi0},${yi0} Z" fill="${COL[k]}"><title>${k}: ${seg[k]} (${(100*f).toFixed(0)}%)</title></path>`;a0=a1;});
  s+=`<text x="${cx}" y="${cy+7}" text-anchor="middle" font-size="26" font-weight="700" fill="#1c2230">${tot}</text>`;
  return svg(260,250,s,'pie chart')+legend();}
function legend(){return `<div class="legend">`+VOTES.map(k=>`<span><i style="background:${COL[k]}"></i>${pretty(k)}</span>`).join('')+`</div>`;}
function rTableScalar(agg,qlabel){const u=agg.meas.pct?'%':'';
  return `<div class="tablewrap"><table><thead><tr><th>${agg.group==='Year'?'Year':'Topic'}</th><th style="text-align:right">${qlabel}</th></tr></thead><tbody>`+
    agg.groups.map(g=>`<tr><td>${pretty(g.key)}</td><td style="text-align:right">${g.value}${u}</td></tr>`).join('')+`</tbody></table></div>`;}

// ---- records ----
function recordsTable(councilor,topic){
  let idx;
  if(councilor!=='__all') idx=[...(motionsByCouncilor[councilor]||new Set())];
  else idx=M.map((m,i)=>i);
  if(topic) idx=idx.filter(i=>M[i].t.includes(topic));
  idx.sort((a,b)=>M[a].d<M[b].d?1:-1);
  if(!idx.length)return '<div class="empty">No records match.</div>';
  const single=councilor!=='__all';
  const head=single?['Date','Their vote','Result','What it was about','Source']:['Date','Result of vote','What it was about','Source'];
  const rows=idx.slice(0,300).map(i=>{const m=M[i],tags=m.t.map(t=>`<span class="tag">${pretty(t)}</span>`).join(''),src=m.s?`<a class="pdf" href="${m.s}" target="_blank" rel="noopener">Record ↗</a>`:'';
    if(single){const v=voteByCM[councilor+'|'+i]||'—';
      return `<tr><td class="mut">${m.d}</td><td>${v==='—'?'—':`<span class="pill ${v}">${v}</span>`}</td><td class="mut">${m.tl||'—'}</td><td>${esc(m.m)} ${tags}</td><td>${src}</td></tr>`;}
    return `<tr><td class="mut">${m.d}</td><td>${m.con?'<span class="pill con">not unanimous</span>':'<span class="pill un">unanimous</span>'}</td><td>${esc(m.m)} ${tags}</td><td>${src}</td></tr>`;});
  return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`+
    (idx.length>300?`<div class="empty">Showing the most recent 300 of ${idx.length}.</div>`:'');
}

// ---- wizard state ----
let state={step:1, scope:null, councilor:'Schoen', q:null, viz:null, topic:''};
const card=document.getElementById('card');

function setFoot(){document.getElementById('foot').innerHTML=
  `Built from the official Record of Votes on amherstma.gov · ${META.attributable_ballots.toLocaleString()} votes across ${META.source_files} meetings. Every figure links back to the source.`;}

function render(){
  if(state.step===1) renderStep1();
  else if(state.step===2) renderStep2();
  else if(state.step===3) renderStep3();
  else renderResult();
  setFoot();
}
function dots(n){return `<div class="steps">${[1,2,3].map(i=>`<div class="s ${i<=n?'on':''}"></div>`).join('')}</div>`;}

function renderStep1(){
  const c=state.scope;
  card.innerHTML=dots(1)+
    `<div class="stepno">Step 1 of 3</div><h2 class="q">Who would you like to find out about?</h2>
    <div class="opts">
      <button class="opt ${c==='councilor'?'sel':''}" data-s="councilor"><span class="oi"><i class="ti ti-user"></i></span>
        <span><span class="ot">One councilor</span><span class="od">Look at a single person's record</span></span><span class="check"><i class="ti ti-circle-check-filled"></i></span></button>
      <button class="opt ${c==='council'?'sel':''}" data-s="council"><span class="oi"><i class="ti ti-users"></i></span>
        <span><span class="ot">The whole council</span><span class="od">Look at the council as a group</span></span><span class="check"><i class="ti ti-circle-check-filled"></i></span></button>
    </div>`+
    (c==='councilor'?`<div class="subpick"><label>Which councilor?</label>
      <select id="csel">${councilors.map(n=>`<option ${n===state.councilor?'selected':''}>${n}</option>`).join('')}</select></div>`:'')+
    navHTML(false, !!c);
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{state.scope=b.dataset.s;state.q=null;state.viz=null;render();});
  const cs=document.getElementById('csel'); if(cs) cs.onchange=e=>state.councilor=e.target.value;
  wireNav();
}
function renderStep2(){
  const list=state.scope==='council'?QUESTIONS.who_council:QUESTIONS.who_councilor;
  const who=state.scope==='council'?'the council':state.councilor;
  card.innerHTML=dots(2)+
    `<div class="stepno">Step 2 of 3</div><h2 class="q">What would you like to know about ${esc(who)}?</h2>
    <div class="opts">${list.map(q=>`<button class="opt ${state.q===q.id?'sel':''}" data-q="${q.id}">
      <span class="oi"><i class="ti ${q.icon}"></i></span>
      <span><span class="ot">${q.t}</span><span class="od">${q.d}</span></span><span class="check"><i class="ti ti-circle-check-filled"></i></span></button>`).join('')}</div>`+
    navHTML(true, !!state.q);
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{state.q=b.dataset.q;state.viz=null;render();});
  wireNav();
}
function curQ(){const list=state.scope==='council'?QUESTIONS.who_council:QUESTIONS.who_councilor;return list.find(q=>q.id===state.q);}
function renderStep3(){
  const q=curQ();const sel=state.viz||q.rec;
  card.innerHTML=dots(3)+
    `<div class="stepno">Step 3 of 3</div><h2 class="q">How would you like to see it?</h2>
    <div class="opts">${q.viz.map(v=>`<button class="opt ${sel===v?'sel':''}" data-v="${v}">
      <span class="oi"><i class="ti ${VIZ[v].icon}"></i></span>
      <span><span class="ot">${VIZ[v].t}</span></span>
      ${v===q.rec?'<span class="rec">Best for this</span>':''}
      <span class="check"><i class="ti ti-circle-check-filled"></i></span></button>`).join('')}</div>`+
    navHTML(true, true, 'See my answer');
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{state.viz=b.dataset.v;render();});
  if(!state.viz)state.viz=q.rec;
  wireNav();
}

function navHTML(showBack, canNext, nextLabel){
  return `<div class="nav">
    <button class="nav-btn back ${showBack?'':'ghost'}" id="back"><i class="ti ti-arrow-left" style="vertical-align:-2px"></i> Back</button>
    <button class="nav-btn next" id="next" ${canNext?'':'disabled'}>${nextLabel||'Next'} <i class="ti ti-arrow-right" style="vertical-align:-2px"></i></button>
  </div>`;}
function wireNav(){
  const b=document.getElementById('back'),n=document.getElementById('next');
  if(b)b.onclick=()=>{state.step=Math.max(1,state.step-1);render();};
  if(n)n.onclick=()=>{if(n.disabled)return;state.step++;if(state.step>3&&!state.viz)state.viz=curQ().rec;render();};
}

// ---- result (live) ----
function sentence(q,agg){
  const who=state.scope==='council'?'The council':state.councilor;
  const scope=state.topic?` on ${pretty(state.topic)}`:'';
  if(q.measure==='vote_breakdown'){const s={yes:0,no:0,abstain:0,absent:0};agg.rows.forEach(b=>s[b.v]++);const t=agg.rows.length||1;
    const most=['yes','no','abstain','absent'].sort((a,b)=>s[b]-s[a])[0];
    const mostTxt={yes:'voted yes most of the time',no:'voted no most of the time',abstain:'abstained most of the time',absent:'was absent most of the time'}[most];
    return `<b>${who}</b>${scope} has taken part in <b>${agg.rows.length} votes</b>. ${who} ${mostTxt} — yes ${s.yes} times, no ${s.no}, abstained ${s.abstain}, and was absent ${s.absent}.`;}
  if(q.measure==='abstain_count'){const tot=agg.rows.length,ab=agg.rows.filter(b=>b.v==='abstain').length;
    return `<b>${who}</b>${scope} abstained <b>${ab} time${ab===1?'':'s'}</b> out of ${tot} votes${ab?` — about 1 in every ${Math.round(tot/Math.max(1,ab))}`:''}.`;}
  if(q.measure==='absent_count'){const ab=agg.rows.filter(b=>b.v==='absent').length;
    return `<b>${who}</b>${scope} was recorded absent <b>${ab} time${ab===1?'':'s'}</b> across ${agg.rows.length} votes.`;}
  const maxG=agg.groups.length?agg.groups.reduce((a,b)=>b.value>a.value?b:a):{key:'',value:0};
  if(q.measure==='votes_count'){
    return `<b>${who}</b>${scope} has cast <b>${agg.rows.length} votes</b>${maxG.key?`, most often on ${pretty(maxG.key)} (${maxG.value})`:''}.`;}
  if(q.measure==='motions_count'){const total=agg.rows.length;
    if(agg.group==='Year')return `The council voted on <b>${total} decisions</b>${scope} in this period — busiest in <b>${maxG.key}</b> with ${maxG.value}.`;
    return `The council voted on <b>${total} decisions</b>${scope}, most about <b>${pretty(maxG.key)}</b> (${maxG.value}).`;}
  if(q.measure==='contested_rate'){const con=agg.rows.filter(m=>m.con).length,t=agg.rows.length||1;
    return `Of <b>${agg.rows.length} decisions</b>${scope}, <b>${Math.round(100*con/t)}%</b> were not unanimous — the council split on about ${con} of them.`;}
  return '';
}
function drawViz(q,agg){
  const v=state.viz,u=agg.meas.pct?'%':'';
  if(v==='cards'){const s={yes:0,no:0,abstain:0,absent:0};agg.rows.forEach(b=>s[b.v]++);return rCards(s);}
  if(v==='donut'){const s={yes:0,no:0,abstain:0,absent:0};agg.rows.forEach(b=>s[b.v]++);return rDonut(s);}
  if(v==='stacked'){let a=agg;if(agg.group==='none')a=aggregate('vote_breakdown','Year',state.councilor,state.topic);return rStacked(a.groups);}
  if(v==='line')return rLine(agg.groups,u);
  if(v==='bar')return rBar(agg.groups,u);
  if(v==='table'){if(agg.meas.kind==='breakdown'){const s={yes:0,no:0,abstain:0,absent:0};agg.rows.forEach(b=>s[b.v]++);return rCards(s);}return rTableScalar(agg,q.t);}
  return '';
}
function renderResult(){
  const q=curQ(); if(!state.viz)state.viz=q.rec;
  const agg=aggregate(q.measure,q.group,state.councilor,state.topic);
  const single=state.scope==='councilor';
  card.innerHTML=
    `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
       <div class="stepno" style="margin:0">Your answer</div>
       <button class="nav-btn back" id="back" style="padding:9px 16px;font-size:15px"><i class="ti ti-arrow-left" style="vertical-align:-2px"></i> Change a step</button>
     </div>
     <p class="answer-lede">${sentence(q,agg)}</p>
     <div id="viz">${drawViz(q,agg)}</div>
     <div class="tweaks">
       ${single?`<div class="tweak"><label>Councilor</label><select id="tw-c">${councilors.map(n=>`<option ${n===state.councilor?'selected':''}>${n}</option>`).join('')}</select></div>`:''}
       <div class="tweak"><label>Narrow to a topic (optional)</label><select id="tw-t"><option value="">All topics</option>${topics.map(t=>`<option value="${t}" ${t===state.topic?'selected':''}>${pretty(t)}</option>`).join('')}</select></div>
       <div class="tweak"><label>Show as</label><div class="viz-switch" id="tw-v">${q.viz.map(v=>`<button class="${state.viz===v?'on':''}" data-v="${v}"><i class="ti ${VIZ[v].icon}" style="font-size:16px"></i> ${VIZ[v].t}</button>`).join('')}</div></div>
     </div>
     <details class="reveal"><summary>See the actual votes behind this</summary><div id="recs"></div></details>
     <div class="startover"><button id="over"><i class="ti ti-refresh" style="vertical-align:-2px"></i> Ask a different question</button></div>`;
  document.getElementById('back').onclick=()=>{state.step=3;render();};
  document.getElementById('over').onclick=()=>{state={step:1,scope:null,councilor:state.councilor,q:null,viz:null,topic:''};render();};
  const tc=document.getElementById('tw-c'); if(tc)tc.onchange=e=>{state.councilor=e.target.value;refreshResult();};
  document.getElementById('tw-t').onchange=e=>{state.topic=e.target.value;refreshResult();};
  document.getElementById('tw-v').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.viz=b.dataset.v;refreshResult();});
  const rec=document.querySelector('.reveal'); rec.addEventListener('toggle',()=>{if(rec.open)document.getElementById('recs').innerHTML=recordsTable(state.councilor,state.topic);});
}
function refreshResult(){
  const q=curQ();const agg=aggregate(q.measure,q.group,state.councilor,state.topic);
  document.querySelector('.answer-lede').innerHTML=sentence(q,agg);
  document.getElementById('viz').innerHTML=drawViz(q,agg);
  document.getElementById('tw-v').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.viz));
  const rec=document.querySelector('.reveal'); if(rec.open)document.getElementById('recs').innerHTML=recordsTable(state.councilor,state.topic);
}
render();
</script></body></html>
