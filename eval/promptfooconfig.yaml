# promptfoo config — topic-tagging quality for ma-municipal-docs
#
# WHY promptfoo here (and not for the vote data): topic tags are a FUZZY,
# language-level judgement, so they are graded with an LLM-as-judge. The vote
# numbers are deterministic and are checked by validate_votes.py instead.
#
# Run:   cd eval && ANTHROPIC_API_KEY=sk-... npx promptfoo@latest eval
#        npx promptfoo@latest view      # open the results UI
#
# This evaluates a candidate LLM tagger. Compare its graded accuracy against
# the current keyword heuristic to decide whether an LLM tagger is worth it.

description: "Amherst council motion topic tagging"

prompts:
  - |
    You label Amherst Town Council motions by subject.
    Allowed tags (use only these): jones-library, schools, budget-appropriation,
    zoning, cpa, appointments, climate-energy, rules-procedure, resolution.
    Reply with a comma-separated list of the tags that apply, or the word "none".
    Motion: {{motion}}

providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    config:
      temperature: 0

defaultTest:
  options:
    provider: anthropic:messages:claude-haiku-4-5-20251001  # judge model

tests: file://topics-tests.yaml
